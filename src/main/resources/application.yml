spring:
  application:
    name: commerce-back-office

  datasource:
    url: jdbc:mysql://localhost:3306/back_office
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-only
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  servlet:
    session:
      timeout: 24h
      cookie:
        # JavaScript의 쿠키 접근 방지 (XSS를 통한 세션 쿠키 탈취 완화)
        http-only: true

        # HTTPS에서만 쿠키 전송 → 실제 배포시 true
        secure: false